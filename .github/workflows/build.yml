name: 构建

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'assets/**'
      - 'docker/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build.yml'

jobs:
  build:
    name: Build Web Page
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          cache: 'pnpm'

      - name: Node - 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: Node - 构建
        run: pnpm build

      - name: 上传文件
        uses: actions/upload-artifact@v7
        with:
          name: Yacd-Meta-Classic
          path: public/**/*
          retention-days: 90
          compression-level: 9